[workspace]
resolver = "3"
members = ["crates/pengitto-core", "crates/pengitto", "crates/pengitto-bench"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pengitto-core = { path = "crates/pengitto-core" }
anyhow = "1"
bstr = "1"
crossbeam-channel = "0.5"
libc = "0.2"
memchr = "2"
rayon = "1"
# Pure-Rust regexes (fancy-regex), no C library (onig).
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_extras = "0.36"
memmap2 = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.17"
notify = "8"
trash = { version = "5", default-features = false }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
# The same as eframe's (pengitto's own state file is RON too).
ron = "0.12"
tempfile = "3"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
